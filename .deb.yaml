ver: "2"
packages:
  - package: pkg-build
    source: pkg-build
    version: 'git'
    architecture:
      - amd64
      - arm64
    maintainer: The OSSPkg Team <github@osspkg.com>
    homepage: https://deb.osspkg.com/
    description:
      - Debian package builder
    section: web
    priority: optional
    control:
      build: goppy build --arch=%arch%
    data:
      usr/bin/pkg-build: build/pkg-build_%arch%
